server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: artagram-gateway
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        pool:
          # Las conexiones se renuevan seguido para repartir la carga entre las
          # replicas que publica Cloud Map y soltar las de una replica retirada.
          max-idle-time: 15s
          max-life-time: 60s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # 1. Autenticación y JWKS -> artagram-auth
        - id: auth-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/auth/**, /.well-known/jwks.json
          filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 300ms
                  factor: 2
                  basedOnPreviousValue: false

        # 2. Perfiles, Seguidores y Media (presign/servir) -> artagram-users
        # (/api/media/** vivia por error en artagram-lienzo; artagram-users ya
        # tiene su propio MediaController idéntico desde antes de hoy)
        - id: users-route
          uri: ${USERS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/perfil/**, /api/perfiles/**, /api/artistas/**, /api/media/**
          filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 300ms
                  factor: 2
                  basedOnPreviousValue: false

        # 3. Feed, Publicaciones, Comentarios, IA y Media -> artagram-feed
        - id: feed-route
          uri: ${FEED_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/feed/**, /api/publicaciones/**, /api/comentarios/**, /api/ia/**, /api/moderacion/**, /media/**
          metadata:
            response-timeout: 15000
          filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 300ms
                  factor: 2
                  basedOnPreviousValue: false

        # 4. Chat Personal y Chat de Comunidad (REST) -> artagram-chat
        # (Debe ir antes de canvas-rest-route para que /api/comunidades/{id}/chat vaya a Chat)
        - id: chat-route
          uri: ${CHAT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/mensajes/**, /api/comunidades/*/chat
          filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 300ms
                  factor: 2
                  basedOnPreviousValue: false

        # 5. Comunidades (CRUD/membresia/banner), Lienzo y Modo Fiesta -> artagram-canvas
        # (corte de trafico real: ya cubierto 1:1 por canvas, verificado esta sesion)
        - id: canvas-rest-route
          uri: ${CANVAS_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/comunidades/**, /api/fiestas/**
          filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 300ms
                  factor: 2
                  basedOnPreviousValue: false

        # 6. KPIs / Dashboard admin -> artagram-users
        # (corte de trafico real: ya es dueño de usuarios.creadoEn/premium y
        # ahora tambien de los eventos minimos de login/sesion-colaborativa
        # que alimentan los 4 KPIs de HU-37 — backv1 ya no sirve ESTE path)
        - id: admin-route
          uri: ${USERS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/admin/**
          filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 300ms
                  factor: 2
                  basedOnPreviousValue: false

        # 7. WebSocket STOMP (/ws) -> artagram-canvas
        # (corte de trafico real: party, lienzo, banner y chat de comunidad/personal
        # ya estan 1:1 en canvas — backv1 ya no sirve ningun trafico de /ws)
        - id: canvas-ws-route
          uri: ${CANVAS_WS_URL:ws://localhost:8088}
          predicates:
            - Path=/ws, /ws/**

        # 8. Suscripciones y Pagos -> artagram-payment
        - id: payment-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/suscripcion/**, /api/pagos/**
          filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 300ms
                  factor: 2
                  basedOnPreviousValue: false

        # 8. Notificaciones (REST + SSE) -> artagram-notifications
        - id: notifications-route
          uri: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/notificaciones/**

app:
  gateway:
    jwt-enabled: ${GATEWAY_JWT_ENABLED:false}
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
    rate-limit-per-second: ${GATEWAY_RATE_LIMIT_PER_SEC:120}
    proxies-confiables: ${GATEWAY_PROXIES_CONFIABLES:0}
    max-fallos-autenticacion: ${GATEWAY_MAX_FALLOS_AUTH:10}
    ventana-fallos: ${GATEWAY_VENTANA_FALLOS:1m}
    duracion-bloqueo: ${GATEWAY_DURACION_BLOQUEO:15m}

management:
  health:
    # Si Redis cae, el gateway sigue atendiendo (el bloqueo deja pasar): no
    # debe marcarse caido ante el ALB por eso.
    redis:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true

logging:
  level:
    root: INFO
    com.artagram: DEBUG
